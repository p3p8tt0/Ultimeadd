<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novità Streaming Italia</title>
<style>
  :root { --bg:#f6f6f8; --card:#fff; --text:#1a1a1f; --muted:#666; --accent:#7b5bf2; --border:#ddd; --ok:#1a8a4a; --err:#c62828; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121216; --card:#1c1c22; --text:#f0f0f4; --muted:#9a9aa5; --border:#33333c; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  .card { max-width:480px; margin:0 auto; background:var(--card); border-radius:16px; padding:20px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 18px; font-size:.9rem; }
  label.title { display:block; font-weight:600; margin:16px 0 6px; font-size:.9rem; }
  input[type=text], input[type=number] { width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; background:transparent; color:var(--text); font-size:1rem; }
  .plats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .plats label { display:flex; align-items:center; gap:8px; padding:10px; border:1px solid var(--border); border-radius:10px; font-size:.9rem; }
  button, a.btn { display:block; width:100%; text-align:center; text-decoration:none; padding:14px; border:0; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:16px; }
  .primary { background:var(--accent); color:#fff; }
  .secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
  #msg { margin-top:10px; font-size:.9rem; min-height:1.2em; }
  #result { display:none; margin-top:8px; }
  small.hint { color:var(--muted); display:block; margin-top:6px; font-size:.8rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Novità Streaming Italia</h1>
  <p class="sub">Le uscite recenti delle piattaforme, direttamente in Stremio.</p>

  <label class="title" for="key">Chiave API TMDB</label>
  <input type="text" id="key" placeholder="Incolla qui la tua chiave" autocomplete="off" autocapitalize="off" spellcheck="false">
  <small class="hint">Gratis su themoviedb.org → Impostazioni → API.</small>

  <label class="title" for="days">Giorni da mostrare</label>
  <input type="number" id="days" value="30" min="1" max="90">

  <label class="title">Piattaforme</label>
  <div class="plats" id="plats"></div>

  <button class="primary" id="gen">Genera link</button>
  <div id="msg"></div>

  <div id="result">
    <a class="btn primary" id="install" href="#">Installa in Stremio</a>
    <button class="secondary" id="copy">Copia link</button>
    <small class="hint">Il link contiene la tua chiave: non condividerlo.</small>
  </div>
</div>

<script>
  const PLATS = { netflix:"Netflix", prime:"Prime Video", hbo:"HBO Max", disney:"Disney+", apple:"Apple TV+", paramount:"Paramount+", discovery:"Discovery+", now:"NOW", raiplay:"RaiPlay", infinity:"Mediaset Infinity", timvision:"TIMvision", crunchyroll:"Crunchyroll" };
  const platsEl = document.getElementById("plats");
  for (const [id, name] of Object.entries(PLATS)) {
    platsEl.insertAdjacentHTML("beforeend", `<label><input type="checkbox" value="${id}" checked> ${name}</label>`);
  }

  const msg = document.getElementById("msg");
  const result = document.getElementById("result");
  let httpsLink = "";

  document.getElementById("gen").addEventListener("click", async () => {
    result.style.display = "none";
    const key = document.getElementById("key").value.trim();
    const days = parseInt(document.getElementById("days").value, 10) || 30;
    const platforms = [...platsEl.querySelectorAll("input:checked")].map((i) => i.value);
    if (!key) { msg.style.color = "var(--err)"; msg.textContent = "Inserisci la chiave TMDB."; return; }
    if (!platforms.length) { msg.style.color = "var(--err)"; msg.textContent = "Scegli almeno una piattaforma."; return; }

    msg.style.color = "var(--muted)"; msg.textContent = "Verifico la chiave…";
    try {
      const r = await fetch("/api/check", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key }) });
      const j = await r.json();
      if (!j.ok) { msg.style.color = "var(--err)"; msg.textContent = "Chiave TMDB non valida."; return; }
    } catch {
      msg.style.color = "var(--err)"; msg.textContent = "Impossibile verificare la chiave."; return;
    }

    const json = JSON.stringify({ key, days, platforms });
    const b64 = btoa(String.fromCharCode(...new TextEncoder().encode(json)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    httpsLink = `${location.origin}/${b64}/manifest.json`;
    document.getElementById("install").href = `stremio://${location.host}/${b64}/manifest.json`;
    msg.style.color = "var(--ok)"; msg.textContent = "Chiave valida. Link pronto!";
    result.style.display = "block";
  });

  document.getElementById("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(httpsLink); msg.textContent = "Link copiato."; }
    catch { msg.textContent = httpsLink; }
  });
</script>
</body>
</html>
